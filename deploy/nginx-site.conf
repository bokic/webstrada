# WebStrada nginx virtual-host configuration.
#
# Document root (/webroot) is expected to be either:
#   - a Docker volume mounted at runtime:  -v /host/site:/webroot
#   - the default empty directory seeded in the image
#
# The Angular admin panel is always served from the image at
# /app/webstrada/dist/webstrada-admin/browser, regardless of the webroot volume.

server {
    listen 80 default_server;
    server_name _;

    # CFML site root — mount a volume here at runtime.
    root /webroot;

    # ------------------------------------------------------------------
    # Angular admin SPA  →  /webstrada/
    # ------------------------------------------------------------------
    location /webstrada/ {
        alias /app/webstrada/dist/webstrada-admin/browser/;
        try_files $uri $uri/ /webstrada/index.html;
    }

    # CFML API endpoints inside the admin panel (served by WebStrada). The
    # panel is deployed at /app/webstrada, so the engine resolves the template
    # as DOCUMENT_ROOT (/app) + REQUEST_URI (/webstrada/...) with no rewriting.
    location ~ ^/webstrada/.*\.(cfm|cfc)(/|$) {
        include        fastcgi_params;
        fastcgi_pass   unix:/app/tmp/webstrada.sock;
        fastcgi_param  SCRIPT_FILENAME  /app$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT    /app;
        fastcgi_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # CFML pages  →  WebStrada FastCGI daemon
    # ------------------------------------------------------------------
    location ~ \.(cfm|cfc)(/|$) {
        include        fastcgi_params;
        fastcgi_pass   unix:/app/tmp/webstrada.sock;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT    $document_root;
        fastcgi_read_timeout 120s;
    }

    # ------------------------------------------------------------------
    # Static files
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # Disable access to hidden files (e.g. .git, .env).
    location ~ /\. {
        deny all;
    }
}
