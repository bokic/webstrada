# WebStrada nginx main configuration (dev-friendly).
#
# Overrides the distro default (/etc/nginx/nginx.conf). For development we
# fold the master and worker into a single process.
#   - master_process off: nginx does NOT fork a separate worker; the master
#     process itself accepts and serves connections. Exactly one process total.
#   - worker_processes 1: harmless leftover, ignored when master_process is off.
# Trade-off: `nginx -s reload` is not available in single-process mode (a full
# restart picks up config changes) — fine for a dev container.

user www-data;
master_process off;
worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    server_tokens   off;

    include /etc/nginx/conf.d/*.conf;
}